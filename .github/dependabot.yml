version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Yama guncellemeleri tek tek PR uretmesin; gurultu review'i oldurur.
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    # Major guncellemeler bilincli bir karardir, otomatik PR ile gelmez.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
