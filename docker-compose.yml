name: business-os

services:
  postgres:
    # pgvector/pgvector:pg17 — resmi postgres 17 + pgvector eklentisi.
    #
    # `postgres:17-alpine` DEGIL: resmi postgres imaji pgvector ICERMEZ ve
    # `CREATE EXTENSION vector` orada basarisiz olur (migration 0011).
    # ADR-0029 embedding'i `vector(1536)` + HNSW index olarak tanimliyor.
    #
    # Bedeli durustce: Debian tabanli, alpine'dan buyuk (~100MB -> ~400MB).
    # PG major surumu AYNI (17) oldugu icin mevcut `postgres-data` volume'u
    # uyumludur; veri dizini yeniden olusturulmaz.
    image: pgvector/pgvector:pg17
    container_name: business-os-postgres
    restart: unless-stopped
    environment:
      # Superuser YALNIZCA container kurulumu icindir. Uygulama ve migration
      # bu rolu kullanmaz — superuser RLS politikalarini bypass eder.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: business_os
      # Turkce collation surprizlerinden kacinmak icin deterministik locale.
      LANG: C
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Yalnizca localhost'a baglanir — container LAN'a acilmaz.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d business_os']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: business-os-redis
    restart: unless-stopped
    # ARCHITECTURE 2 / Faz 1 karari: container hazir bekler, uygulama BAGLANMAZ.
    # Cache saglayici karari Faz 3'te verilecek.
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:-redis}']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD:-redis}" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
