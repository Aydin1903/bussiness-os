name: business-os

services:
  postgres:
    # pgvector/pgvector:pg17 — resmi postgres 17 + pgvector eklentisi.
    #
    # `postgres:17-alpine` DEGIL: resmi postgres imaji pgvector ICERMEZ ve
    # `CREATE EXTENSION vector` orada basarisiz olur (migration 0011).
    # ADR-0029 embedding'i `vector(1536)` + HNSW index olarak tanimliyor.
    #
    # Bedeli durustce: Debian tabanli, alpine'dan buyuk (~100MB -> ~400MB).
    # PG major surumu AYNI (17) oldugu icin mevcut `postgres-data` volume'u
    # uyumludur; veri dizini yeniden olusturulmaz.
    image: pgvector/pgvector:pg17
    container_name: business-os-postgres
    restart: unless-stopped
    environment:
      # Superuser YALNIZCA container kurulumu icindir. Uygulama ve migration
      # bu rolu kullanmaz — superuser RLS politikalarini bypass eder.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: business_os
      # Turkce collation surprizlerinden kacinmak icin deterministik locale.
      LANG: C
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Yalnizca localhost'a baglanir — container LAN'a acilmaz.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d business_os']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: business-os-redis
    restart: unless-stopped
    # ARCHITECTURE 2 / Faz 1 karari: container hazir bekler, uygulama BAGLANMAZ.
    # Cache saglayici karari Faz 3'te verilecek.
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:-redis}']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD:-redis}" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    # ADR-0009 / ADR-0037 §5.5 — LOKAL ve CI nesne deposu.
    #
    # Production Cloudflare R2'dir; MinIO AYNI S3 API'sini konusur, yani
    # uygulama tarafinda TEK adapter ve TEK kod yolu vardir. Fark yalnizca
    # `STORAGE_ENDPOINT` + `STORAGE_FORCE_PATH_STYLE`tir.
    #
    # Gerekce ADR-0009'un ikinci maddesidir: "lokal gelistirme ve CI'in gercek
    # bir bulut hesabina bagimli olmamasi gerekiyor."
    #
    # ⚠️ KALICI DERS (CLAUDE.md): `docker-compose.yml` degistiginde CALISAN
    # container kendi kendine guncellenmez. Bu servis eklendikten sonra
    # `docker compose up -d` ELLE calistirilmalidir; aksi halde belge uclarinin
    # hepsi sebebi belirsiz bir baglanti hatasiyla duser.
    image: minio/minio:latest
    container_name: business-os-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-businessos}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-businessos_dev_secret}
    ports:
      # 9000 = S3 API, 9001 = web konsolu. Yalnizca localhost'a baglanir.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    # Bucket'i BIR KEZ olusturur ve cikar.
    #
    # ⚠️ Neden ayri bir servis: MinIO acilista bucket OLUSTURMAZ ve uygulama da
    # olusturmaz (bucket yonetimi bir ALTYAPI isidir — ADR-0009: "saglayiciya
    # ozgu gelismis ozellikler soyutlamanin disinda kalir"). Elle yaratmaya
    # birakilsaydi, yeni bir gelistiricide modulun her ucu 502 donerdi ve sebep
    # hicbir yerde yazmazdi.
    image: minio/mc:latest
    container_name: business-os-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-businessos}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-businessos_dev_secret}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-business-os-documents}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
